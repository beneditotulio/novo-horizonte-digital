version: '3.8'

services:
  # SQL Server Database
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "NovoHorizonte@2024"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - novo-horizonte-network

  # ASP.NET Core Backend API
  api:
    build:
      context: ./backend/NovoHorizonteDigital.API
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=https://+:5001
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=NovoHorizonteDigital;User Id=sa;Password=NovoHorizonte@2024;TrustServerCertificate=true;
      - Jwt__SecretKey=YourVerySecureSecretKeyWith32CharactersMinimumRequirementForHS256Algorithm
      - Jwt__Issuer=NovoHorizonteDigital
      - Jwt__Audience=NovoHorizonteDigitalUsers
    ports:
      - "5001:5001"
    depends_on:
      - sqlserver
    networks:
      - novo-horizonte-network
    volumes:
      - ${APPDATA}\\Docker\\certs:/root/.aspnet/https:ro

  # React Frontend
  web:
    build:
      context: ./frontend/novo-horizonte-app
      dockerfile: Dockerfile
    environment:
      - REACT_APP_API_URL=https://api:5001/api
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - novo-horizonte-network

volumes:
  sqlserver-data:

networks:
  novo-horizonte-network:
    driver: bridge
